<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINE BLOCK</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bc9e8;font-family:Arial,sans-serif}#game{display:block;width:100%;height:100%}
#hud{position:fixed;top:14px;left:14px;padding:12px 15px;color:white;background:#142b26b8;border:1px solid #ffffff35;border-radius:10px;line-height:1.55;text-shadow:0 1px 2px #000;pointer-events:none}
#help{position:fixed;left:14px;bottom:84px;padding:10px 12px;color:white;background:#142b26b8;border-radius:9px;font-size:12px;line-height:1.5;pointer-events:none}#hotbar{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:6px}.slot{width:48px;height:48px;border:3px solid #777;background:#242424b9;display:grid;place-items:center}.slot.active{border-color:white;transform:translateY(-4px)}.swatch{width:25px;height:25px;border-radius:4px;border:1px solid #ffffff70;box-shadow:inset 2px 2px 4px #ffffff55,inset -3px -3px 5px #0005}#crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:white;font-size:24px;text-shadow:0 1px 4px #000;pointer-events:none}#loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#83bde7,#d8e9e7);color:#173b32;font-weight:bold;font-size:22px;z-index:5}#bar{width:260px;height:10px;background:#ffffff80;border-radius:20px;overflow:hidden;margin-top:12px}#fill{height:100%;width:0;background:#378e50}#loadtext{text-align:center}
</style></head><body>
<div id="loading"><div id="loadtext">MINE BLOCK<br><small>Generating world... 0%</small><div id="bar"><div id="fill"></div></div></div></div><canvas id="game"></canvas>
<div id="hud"><b>MINE BLOCK</b><br>3D GRAPHICS EDITION<br><span id="blockname">Block: Grass</span><br>WASD: Move | Space: Jump</div>
<div id="help">Click game to capture mouse<br>Mouse: Look around<br>Left click: Break | Right click: Place<br>1–6: Select block</div><div id="crosshair">+</div><div id="hotbar"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game');const loading=document.getElementById('loading');const fill=document.getElementById('fill');
if(!window.THREE){document.getElementById('loadtext').innerHTML='MINE BLOCK<br><small>3D library did not load. Check internet and refresh.</small>';return;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc9e8);scene.fog=new THREE.Fog(0xb8d5df,34,105);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
scene.add(new THREE.HemisphereLight(0xd9edff,0x66734a,2));const sun=new THREE.DirectionalLight(0xffe2b5,3.1);sun.position.set(-35,55,28);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-48;sun.shadow.camera.right=48;sun.shadow.camera.top=48;sun.shadow.camera.bottom=-48;sun.shadow.bias=-.00025;scene.add(sun);
const mat=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const mats={grass:mat(0x719c45),dirt:mat(0x795137),stone:mat(0x858984),wood:mat(0x79502e),sand:mat(0xd8c58b),brick:mat(0x9b4b37),leaf:mat(0x416b35),water:new THREE.MeshStandardMaterial({color:0x398da0,roughness:.18,metalness:.22,transparent:true,opacity:.82})};
const cube=new THREE.BoxGeometry(1,1,1),world=[],rayObjects=[];
function addBlock(x,y,z,type,cast=true){const m=new THREE.Mesh(cube,mats[type]||mats.grass);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;m.userData.type=type;scene.add(m);world.push(m);rayObjects.push(m);return m;}
function seeded(x,z){const n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n)}function heightAt(x,z){return Math.floor(1.5+Math.sin(x*.16)*1.2+Math.cos(z*.14)*1.1+Math.sin((x+z)*.09)*1.2)}
function makeTree(x,z){const y=heightAt(x,z);for(let i=0;i<4;i++)addBlock(x,y+.5+i,z,'wood');for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=2;dy<=4;dy++)if(Math.abs(dx)+Math.abs(dz)+(dy===4?1:0)<5&&seeded(x+dx*3+dy,z+dz*5)>.08)addBlock(x+dx,y+dy,z+dz,'leaf',false);}
function makeCabin(x,z){const y=heightAt(x,z);for(let dx=-3;dx<=3;dx++)for(let dz=-2;dz<=2;dz++){addBlock(x+dx,y+.5,z+dz,'wood');if(Math.abs(dx)===3||Math.abs(dz)===2)for(let h=1;h<=3;h++)addBlock(x+dx,y+h+.5,z+dz,'wood');}for(let h=0;h<4;h++)for(let dx=-3+h;dx<=3-h;dx++)for(let dz=-2;dz<=2;dz++)addBlock(x+dx,y+4.5+h,z+dz,'brick',false);}
function buildWorld(){const N=46;for(let x=-N/2;x<N/2;x++)for(let z=-N/2;z<N/2;z++){const h=heightAt(x,z);for(let y=-2;y<=h;y++){const type=y===h?(h<=1?'sand':'grass'):(y>=h-2?'dirt':'stone');addBlock(x,y,z,type);} }for(let i=0;i<36;i++){const x=Math.floor(seeded(i,8)*42-21),z=Math.floor(seeded(i,19)*42-21);if(Math.abs(x)>5||Math.abs(z)>5)makeTree(x,z);}makeCabin(-11,10);makeCabin(13,-12);const water=new THREE.Mesh(new THREE.PlaneGeometry(25,18),mats.water);water.rotation.x=-Math.PI/2;water.position.set(12,1,10);water.receiveShadow=true;scene.add(water);const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat(0x8eaa69));ground.rotation.x=-Math.PI/2;ground.position.y=-2.55;ground.receiveShadow=true;scene.add(ground);}buildWorld();
function makePerson(){const g=new THREE.Group(),skin=mat(0xc99b70),shirt=mat(0x3e9db4),pants=mat(0x344c78),hair=mat(0x44352b);function part(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;g.add(o);}part(.58,.62,.34,shirt,0,1.25,0);part(.42,.48,.42,skin,0,1.82,0);part(.44,.13,.44,hair,0,2.12,0);part(.19,.65,.22,pants,-.17,.57,0);part(.19,.65,.22,pants,.17,.57,0);part(.18,.62,.2,shirt,-.39,1.28,0);part(.18,.62,.2,shirt,.39,1.28,0);scene.add(g);return g;}
const player=makePerson();player.position.set(0,heightAt(0,0)+.05,0);let yaw=0,pitch=.22,selected=0,velocityY=0,onGround=true;
const blockTypes=['grass','dirt','stone','wood','sand','brick'],labels=['Grass','Dirt','Stone','Wood','Sand','Brick'],colors=['#719c45','#795137','#858984','#987044','#d8c58b','#b6533d'],hotbar=document.getElementById('hotbar');
blockTypes.forEach((t,i)=>{const el=document.createElement('div');el.className='slot'+(i===0?' active':'');el.innerHTML='<div class="swatch" style="background:'+colors[i]+'"></div>';hotbar.appendChild(el)});
function selectBlock(i){selected=(i+6)%6;[...hotbar.children].forEach((e,n)=>e.classList.toggle('active',n===selected));document.getElementById('blockname').textContent='Block: '+labels[selected];}
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Digit')){const n=Number(e.code.slice(5));if(n>=1&&n<=6)selectBlock(n-1)}if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
let locked=false;canvas.addEventListener('click',()=>{if(document.pointerLockElement!==canvas)canvas.requestPointerLock?.()});document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===canvas);document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0025;pitch=Math.max(-.15,Math.min(.75,pitch+e.movementY*.002))});canvas.addEventListener('contextmenu',e=>e.preventDefault());
const raycaster=new THREE.Raycaster();function targetBlock(){raycaster.setFromCamera(new THREE.Vector2(0,0),camera);return raycaster.intersectObjects(rayObjects,false)[0]||null;}
canvas.addEventListener('mousedown',e=>{if(!locked)return;const hit=targetBlock();if(!hit)return;if(e.button===0){const o=hit.object;scene.remove(o);let i=world.indexOf(o);if(i>=0)world.splice(i,1);i=rayObjects.indexOf(o);if(i>=0)rayObjects.splice(i,1);}else if(e.button===2){const p=hit.object.position.clone().add(hit.face.normal);if(p.distanceTo(player.position)>1.5)addBlock(Math.round(p.x),Math.round(p.y),Math.round(p.z),blockTypes[selected]);}});
function animate(){requestAnimationFrame(animate);const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),speed=keys.ShiftLeft?7:4.4;player.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*s)*speed/60;player.position.z+=(Math.cos(yaw)*f-Math.sin(yaw)*s)*speed/60;if(f||s)player.rotation.y=yaw+Math.PI;if(keys.Space&&onGround){velocityY=7;onGround=false;}velocityY-=18/60;player.position.y+=velocityY/60;const floor=heightAt(Math.round(player.position.x),Math.round(player.position.z))+.05;if(player.position.y<=floor){player.position.y=floor;velocityY=0;onGround=true;}const target=player.position.clone().add(new THREE.Vector3(0,1.4,0)),dist=7.5,horizontal=Math.cos(pitch)*dist;camera.position.set(target.x+Math.sin(yaw)*horizontal,target.y+Math.sin(pitch)*dist+1,target.z+Math.cos(yaw)*horizontal);camera.lookAt(target);renderer.render(scene,camera);}animate();
const start=Date.now(),progress=setInterval(()=>{const pct=Math.min(100,Math.floor((Date.now()-start)/18));fill.style.width=pct+'%';document.querySelector('#loadtext small').textContent='Generating world... '+pct+'%';if(pct>=100){clearInterval(progress);loading.style.display='none'}},18);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
